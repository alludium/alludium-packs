kind: task-definition-template
apiVersion: alludium/v1alpha1
id: vc.configure_sourcing_line
version: 0.1.0
title: Configure Sourcing Line
category: Venture Capital
visibility: workspace
tags:
- vc
- origination
- sourcing-line
- setup
definition:
  name: Configure Sourcing Line
  slug: configure-sourcing-line
  description: Turn a sourcing hypothesis into a paused, measurable sourcing-line project with approved sources, screen, cadence, review policy, and outreach boundaries.
  allowSubtasks: true
  definitionJson:
    vertical: vc
    stage: setup
    taskFamily: sourcing_line_setup
    documentRefs:
    - documentId: vc.document.sourcing_line_template_catalog
      usage: methodology
    - documentId: vc.document.source_registry_template
      usage: operating_guidance
    - documentId: vc.document.origination_pipeline_sop
      usage: operating_guidance
    requiredSkills:
    - origination-pipeline-orchestration
    - vc-source-registry-and-state-management
    recommendedAgentTemplate: vc_sourcing_operator
    plannedRecommendedAgentTemplate: vc_sourcing_operator
    supportedProjectTypes:
    - vc_sourcing_line
    supportedProjectScopes:
    - project_instance
    instructions:
      executionInstructions: 'Use the dedicated Sourcing Line chat to shape one sourcing experiment. A sourcing line is registered source(s) x query or screen x cadence x review policy x outreach policy, not a provider connection. Start from an optional starter configuration, then capture the hypothesis, source keys, connection assumptions, exclusions, evidence requirements, cadence, timezone, cursor/window, result limit, budget, Inbox threshold, review owner, outreach mode, success metrics, review date, and retirement condition. Verify the native `vc.origination_pipeline_contains_sourcing_line` relationship or propose `project-relationship.create` when the hub and line already exist but are not linked. Update the draft line configuration only after human approval and leave schedules disabled. Use `definitionJson.documentRefs` as the durable document reference contract.'
      missingInputPolicy: Keep setup incomplete until the line hypothesis, parent pipeline project ID, source mix, screen, cadence, budget posture, review policy, and outreach boundary are explicit.
      externalActionPolicy: Configuration only. Do not read paid sources, enable schedules, create candidates, write external systems, or send outreach.
      humanConfirmationPolicy: always
      completionCriteria:
      - The line has one coherent, testable learning question.
      - Source keys refer to the parent pipeline source registry and do not embed credentials.
      - Cadence, result limits, budget, review threshold, and retirement condition are explicit.
      - Outreach is disabled or approval-gated and never represented as an automatic send.
      - Approved configuration fields are ready to persist before the draft line moves to paused.
    humanDecisionPoints:
    - Approve the source mix and query or screen.
    - Approve paid-source budget and result limits.
    - Approve any later schedule enablement or outreach experiment separately.
