kind: task-definition-template
apiVersion: alludium/v1alpha1
id: vc.create_sourcing_line
version: 0.2.0
title: Create Sourcing Line
category: Venture Capital
visibility: workspace
tags:
- vc
- origination
- sourcing-line
- creation
definition:
  name: Create Sourcing Line
  slug: create-sourcing-line
  description: Create a minimal Fund-specific Sourcing Line so its configuration continues in the line's canonical chat.
  allowSubtasks: false
  definitionJson:
    vertical: vc
    stage: setup
    taskFamily: sourcing_line_creation
    requiredSkills:
    - origination-pipeline-orchestration
    recommendedAgentTemplate: vc_sourcing_line_manager
    plannedRecommendedAgentTemplate: vc_sourcing_line_manager
    supportedProjectTypes:
    - vc_sourcing_line
    supportedProjectScopes:
    - project_instance
    instructions:
      executionInstructions: 'Capture a human-readable line name and require `fund_id` to exactly match one active record in the canonical `vc.funds` collection. Emit `projectCreation.createRequest` with only those required field values. Do not require or create an Origination Pipeline hub relationship. The platform finalizer creates the draft Sourcing Line, then opens its canonical chat. Defer the hypothesis, sources, screen, cadence, review policy, and outreach policy to `configure-sourcing-line`.'
      missingInputPolicy: Ask for a short line name and an active configured Fund. Keep creation incomplete when fund_id is missing, unknown, or inactive.
      externalActionPolicy: Create only the draft project. Do not run sources, enable schedules, create candidates, spend money, write external systems, or send outreach.
      humanConfirmationPolicy: always
      completionCriteria:
      - Line name is known.
      - fund_id exactly matches one active vc.funds record.
      - Draft project creation is proposed without a mandatory hub relationship.
    humanDecisionPoints:
    - Confirm the line name and Fund.
fields:
  input:
  - key: line_name
    name: Line Name
    fieldType: string
    required: true
    position: 0
    config: {}
  - key: fund_id
    name: Fund ID
    fieldType: string
    required: true
    position: 1
    config: {}
  output:
  - key: projectCreation
    name: Project Creation Request
    fieldType: json
    required: true
    position: 0
    config:
      contractRef: projectCreation.createRequest.v1
      requiredPaths:
      - fieldValues.line_name
      - fieldValues.fund_id
runtime:
  defaultExecutionContext:
    sourceMetadata:
      templateFamily: vc
      taskKind: create_sourcing_line
      projectType: vc_sourcing_line
  requiredResources:
    requiresTaskChat: true
  executionProfile:
    agentStartsImmediately: true
    preferredMode: guided_creation
    requiresHumanConfirmationToComplete: true
