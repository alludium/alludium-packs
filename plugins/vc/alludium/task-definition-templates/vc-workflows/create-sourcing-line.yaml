kind: task-definition-template
apiVersion: alludium/v1alpha1
id: vc.create_sourcing_line
version: 0.1.0
title: Create Sourcing Line
category: Venture Capital
visibility: workspace
tags:
- vc
- origination
- sourcing-line
- creation
definition:
  name: Create Sourcing Line
  slug: create-sourcing-line
  description: Create the minimal draft Sourcing Line and its native relationship so configuration continues in the line's canonical chat.
  allowSubtasks: false
  definitionJson:
    vertical: vc
    stage: setup
    taskFamily: sourcing_line_creation
    requiredSkills:
    - origination-pipeline-orchestration
    recommendedAgentTemplate: vc_sourcing_operator
    plannedRecommendedAgentTemplate: vc_sourcing_operator
    supportedProjectTypes:
    - vc_sourcing_line
    supportedProjectScopes:
    - project_instance
    instructions:
      executionInstructions: 'Capture only a human-readable line name and the current Origination Pipeline project ID. Emit `projectCreation.createRequest` with the required field values and `relationships: [{ direction: "incoming", relatedProjectId: origination_pipeline_project_id, relationshipTypeKey: "vc.origination_pipeline_contains_sourcing_line", metadata: { creationSource: "create-sourcing-line" } }]`. The platform finalizer must atomically create the draft Sourcing Line and relationship, then open the new project canonical chat. Do not collect the line hypothesis, source mix, screen, cadence, review policy, or outreach policy here; the dedicated line chat and `configure-sourcing-line` task own that proposal.'
      missingInputPolicy: Ask only for a short line name when it cannot be inferred. The current Origination Pipeline project ID is mandatory.
      externalActionPolicy: Create only the draft project and native project relationship. Do not run sources, enable schedules, create candidates, spend money, write external systems, or send outreach.
      humanConfirmationPolicy: always
      completionCriteria:
      - Line name and parent Origination Pipeline project ID are known.
      - Atomic draft creation and incoming relationship are proposed.
      - Configuration is explicitly deferred to the line's canonical chat.
    humanDecisionPoints:
    - Confirm the draft line name.
fields:
  input:
  - key: line_name
    name: Line Name
    fieldType: string
    required: true
    position: 0
    config: {}
  - key: origination_pipeline_project_id
    name: Origination Pipeline Project ID
    fieldType: string
    required: true
    position: 1
    config: {}
  output:
  - key: relationship_to_pipeline_key
    name: Pipeline Relationship Key
    fieldType: string
    required: true
    position: 0
    config: {}
  - key: projectCreation
    name: Project Creation Request
    fieldType: json
    required: true
    position: 1
    config:
      contractRef: projectCreation.createRequest.v1
      requiredPaths:
      - createRequest.fieldValues.line_name
      - createRequest.fieldValues.origination_pipeline_project_id
      - createRequest.fieldValues.relationship_to_pipeline_key
      - createRequest.relationships
      - createRequest.relationships[].direction
      - createRequest.relationships[].relatedProjectId
      - createRequest.relationships[].relationshipTypeKey
      - createRequest.relationships[].metadata
runtime:
  defaultExecutionContext:
    sourceMetadata:
      templateFamily: vc
      taskKind: create_sourcing_line
      projectType: vc_sourcing_line
  requiredResources:
    requiresTaskChat: true
  executionProfile:
    agentStartsImmediately: true
    preferredMode: guided_creation
    requiresHumanConfirmationToComplete: true
