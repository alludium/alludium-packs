kind: task-definition-template
apiVersion: alludium/v1alpha1
id: vc.generate_refresh_evaluation_report
version: 1.0.0
title: Generate or Refresh Evaluation Report
category: Venture Capital
visibility: workspace
tags: [vc, evaluation, living-document]
definition:
  name: Generate or Refresh Evaluation Report
  slug: generate-refresh-evaluation-report
  description: Generate or refresh the living evidence-backed Evaluation Report for one Deal at any active stage.
  allowSubtasks: false
  definitionJson:
    vertical: vc
    stageIndependent: true
    taskFamily: evaluation
    documentRefs:
      - {documentId: vc.document.deal_pipeline_evaluation_criteria, usage: methodology}
      - {documentId: vc.document.deal_pipeline_evaluation_report_template, usage: output_template, outputFieldKey: evaluation_report_artifact_id}
      - {documentId: vc.document.evidence_citation_style_guide, usage: style_guide}
      - {documentId: vc.document.template_use_guidance, usage: operating_guidance}
    requiredSkills: [generate-or-refresh-living-report, investment-diligence-question-framework, market-map-building, commercial-evaluation-and-market-risk, technical-evaluation-and-product-risk, financial-evaluation-and-financing-risk, team-evaluation-and-founder-risk, red-flags-scanner, citation-enforcement]
    plannedRecommendedAgentTemplate: vc_deal_analyst
    recommendedAgentTemplate: vc_deal_analyst
    supportedProjectTypes: [vc_deal_pipeline]
    supportedProjectScopes: [project_instance]
    instructions:
      executionInstructions: >-
        Apply `generate-or-refresh-living-report` to discover the current project-linked evidence corpus, include the mapped Screening Report and any additive `focus_artifact_ids`, compare the prior evidence basis when refreshing, and preserve the report lifecycle. Use `definitionJson.documentRefs` as the durable criteria, template, style, and operating-guidance contract. Maintain the Evaluation Report as the living record of evidence, change, open questions, risk, and next work. Apply the source-neutral Evaluation Criteria by decision-useful domain; do not mechanically reproduce a source checklist. Keep Fund thesis as a separate exact-match frame, render from the Evaluation Report Template, and return the resulting artifact ID as `evaluation_report_artifact_id`. Do not record an investment decision or move stage.
      missingInputPolicy: Use available evidence, preserve unknowns and conflicts, and ask only when no readable source exists.
      externalActionPolicy: Do not send messages, mutate CRM, create tasks or projects, move stage, or record an investment decision.
      completionCriteria:
        - The report covers all grouped evidence domains and records material change since the previous version.
        - Claims, unknowns, conflicts, risks, and next evidence are explicit.
        - The shared living-report lifecycle and evidence-basis manifest contract is satisfied.
        - The resulting ID is saved to evaluation_report_artifact_id.
    humanDecisionPoints:
      - Review the analysis and approve any follow-up work or lifecycle decision separately.
fields:
  input:
    - {key: company_name, name: Company Name, fieldType: string, required: true, position: 0, config: {}}
    - {key: fund_id, name: Confirmed Fund ID, fieldType: string, required: false, position: 1, config: {}}
    - {key: focus_artifact_ids, name: Focus Artifact IDs, fieldType: string, required: false, position: 2, config: {description: "Optional sources to emphasize in addition to all readable project-linked evidence."}}
    - {key: screening_report_artifact_id, name: Screening Report, fieldType: file, required: false, position: 3, config: {}}
    - {key: existing_evaluation_report_artifact_id, name: Existing Evaluation Report, fieldType: file, required: false, position: 4, config: {}}
  output:
    - key: evaluation_report_artifact_id
      name: Evaluation Report
      fieldType: file
      required: true
      position: 0
      config: {documentRefId: vc.document.deal_pipeline_evaluation_report_template}
runtime:
  defaultExecutionContext:
    sourceMetadata: {templateFamily: vc-workflows, taskKind: evaluation_report}
  requiredResources: {requiresTaskChat: true}
  executionProfile: {agentStartsImmediately: true, requiresHumanConfirmationToComplete: true, preferredMode: guided_execution, preferredAgentType: vc_deal_analyst}
ui: {renderer: generic, surfaceKey: null, frameRef: null}
