kind: task-definition-template
apiVersion: alludium/v1alpha1
id: vc.link_existing_origination_candidate
version: 0.1.0
title: Link Existing Origination Candidate
category: Venture Capital
visibility: workspace
tags:
- vc
- origination
- candidate
- provenance
definition:
  name: Link Existing Origination Candidate
  slug: link-existing-origination-candidate
  description: Add one reviewed Sourcing Line provenance relationship to an existing Origination Candidate without duplicating or reassigning the candidate.
  allowSubtasks: false
  definitionJson:
    vertical: vc
    stage: source
    taskFamily: origination_candidate_link
    documentRefs:
    - documentId: vc.document.dedupe_novelty_policy
      usage: policy
    requiredSkills:
    - vc-sourcing-dedupe-and-novelty-check
    - citation-enforcement
    recommendedAgentTemplate: vc_sourcing_operator
    plannedRecommendedAgentTemplate: vc_sourcing_operator
    supportedProjectTypes:
    - vc_sourcing_line
    supportedProjectScopes:
    - project_instance
    instructions:
      executionInstructions: >-
        Link one existing `vc_origination_candidate` project to the current Sourcing Line after an exact identity and access check. Require explicit `sourcing_line_project_id` and `candidate_project_id`; do not guess either ID from names, search ranking, prior chat, or a primary-line label. Read both projects, confirm that the source is the current `vc_sourcing_line`, confirm that the target is the intended `vc_origination_candidate`, and inspect existing relationships before mutating. If the active `vc.sourcing_line_originated_candidate` edge already exists, return its real relationship ID as `already_linked` and do not create another edge. Otherwise, after explicit human approval, call `project-relationship.create` exactly once with `sourceProjectId=sourcing_line_project_id`, `targetProjectId=candidate_project_id`, `relationshipTypeKey=vc.sourcing_line_originated_candidate`, and metadata that preserves the reviewed source key, source receipt reference, observation time, and link reason when supplied. Return `linked` only from the terminal platform receipt and preserve every other Sourcing Line relationship. Do not create a Candidate, alter Candidate fields, select a Deal Fund, write CRM, or replace prior provenance. Use `definitionJson.documentRefs` as the durable policy contract.
      missingInputPolicy: >-
        Keep the task incomplete until the existing Candidate project ID, current Sourcing Line project ID, and enough evidence to confirm the identity match are available. Candidate project ID is intentionally collected during reviewed task intake rather than inferred from Sourcing Line data.
      externalActionPolicy: >-
        The native project relationship is the only allowed write. Require explicit human approval immediately before `project-relationship.create`; all identity, dedupe, and relationship checks are read-only.
      humanConfirmationPolicy: always_before_relationship_create
      completionCriteria:
      - Both project IDs and project types were read and verified in the current workspace.
      - Dedupe evidence supports linking to the existing Candidate rather than creating a duplicate.
      - The active provenance relationship exists and its real platform relationship ID is recorded.
      - No existing Sourcing Line relationship or Candidate field was removed or overwritten.
    humanDecisionPoints:
    - Confirm the existing Candidate identity when source records or company names conflict.
    - Approve adding the Sourcing Line provenance relationship.
fields:
  input:
  - key: sourcing_line_project_id
    name: Sourcing Line Project ID
    fieldType: string
    required: true
    position: 0
    config: {}
  - key: candidate_project_id
    name: Existing Candidate Project ID
    fieldType: string
    required: false
    position: 1
    config: {}
  - key: source_receipt_reference
    name: Source Receipt Reference
    fieldType: string
    required: false
    position: 2
    config: {}
  - key: link_reason
    name: Link Reason
    fieldType: richtext
    required: false
    position: 3
    config: {rows: 4}
  output:
  - key: relationship_id
    name: Relationship ID
    fieldType: string
    required: true
    position: 0
    config: {}
  - key: candidate_project_id
    name: Candidate Project ID
    fieldType: string
    required: true
    position: 1
    config: {}
  - key: link_status
    name: Link Status
    fieldType: string
    required: true
    position: 2
    config: {}
  - key: relationship_summary
    name: Relationship Summary
    fieldType: richtext
    required: true
    position: 3
    config: {rows: 6}
runtime:
  defaultExecutionContext:
    sourceMetadata:
      templateFamily: vc
      taskKind: link_existing_origination_candidate
      projectType: vc_sourcing_line
  requiredResources:
    requiresTaskChat: true
  executionProfile:
    agentStartsImmediately: true
    preferredMode: guarded_mutation
    requiresHumanConfirmationToComplete: true
