kind: task-definition-template
apiVersion: alludium/v1alpha1
id: vc.prepare_pipeline_meeting
version: 1.0.1
title: Prepare Meeting
category: Venture Capital
visibility: workspace
tags:
- vc
- meeting
- meeting-prep
definition:
  name: Prepare Meeting
  slug: prepare-pipeline-meeting
  description: Prepare Meeting for one Pipeline Deal using its confirmed Organisation and supplied evidence.
  allowSubtasks: false
  definitionJson:
    vertical: vc
    taskFamily: meeting
    documentRefs:
    - documentId: vc.document.initial_call_brief_template
      usage: output_template
      outputFieldKey: meeting_brief_artifact_id
    - documentId: vc.document.evidence_citation_style_guide
      usage: style_guide
    - documentId: vc.document.template_use_guidance
      usage: operating_guidance
    requiredSkills:
    - meeting-prep-and-summary
    - citation-enforcement
    plannedRecommendedAgentTemplate: vc_deal_analyst
    recommendedAgentTemplate: vc_deal_analyst
    supportedProjectTypes:
    - vc_deal_pipeline
    instructions:
      executionInstructions: 'Apply `meeting-prep-and-summary` to prepare this specific meeting: company context,
        source-backed claims to validate, targeted questions, agenda and desired outcomes. Use the supplied meeting
        goal, attendees, date and notes plus relevant readable project-linked and task-chat sources. A pitch deck
        is optional; prior notes or other supplied evidence are sufficient. The company is the Deal''s confirmed
        Organisation. company_name carries its Platform-supplied name and optional organisation_id is for tool calls
        only. Do not take company identity from the Deal title or legacy company fields, ask the human to re-enter
        it, or change People or Organisations. Respect the requested evidence scope; connected providers and external
        research are optional and must stay within that scope. Missing calendar, CRM or research connections do
        not block work from supplied evidence. Apply the output template and guidance in `definitionJson.documentRefs`,
        adapting headings to the actual meeting type. Cite material claims and distinguish source statements, inference
        and unknowns. Create a separate standalone safe static HTML Meeting Brief for this meeting with `artifact.createTextArtifact`,
        a `.html` filename and `mimeType: "text/html"`. The task run supplies the current Deal scope. Preserve earlier
        meetings'' files and the four living reports; do not use `project.instantiateTemplate` or the living-report
        refresh lifecycle for this task. Save the returned artifact ID with the task output `meeting_brief_artifact_id`.
        This is a per-meeting task output, not a singleton Deal field. Recording a discussion in this output does
        not authorize a canonical investment decision or stage move. Keep the Deal fields current with the Platform
        Record Field Maintenance skill: read them with `field-values.getFields`, use `field-values.setField` to
        fill editable empty Deal fields that the evidence in this task clearly supports, and suggest rather than
        make any change to a populated field. Leave the Fund, lifecycle stage and decision fields, and all People
        and Organisation records, to the human and the Deal Manager. In the completion summary, name each field
        you filled or suggest changing by its label. For a suggested change, give the current value and the value the evidence supports, and ask whether to update it; a yes from the human is an explicit request to write it. Do not treat a meeting date as a metric''s as-of date unless
        the source explicitly establishes that relationship.'
      missingInputPolicy: Use the confirmed Organisation and available sources; ask only for an unclear meeting
        goal/type or absent readable evidence. A pitch deck is never required. Mark unavailable optional details
        as unknown.
      externalActionPolicy: Draft only. Do not send messages, write external CRM records, change calendars or Drive,
        create tasks/projects, move stage, or record an investment decision.
      completionCriteria:
      - The Meeting Brief is a saved HTML task output with cited evidence and clear gaps.
      - Earlier meeting files and living reports are preserved; no investment decision or identity record is changed.
      - Eligible empty Deal fields are filled from explicit evidence and populated differences are presented for
        human review.
    humanDecisionPoints:
    - Review the output and any proposed field replacement; final task completion remains human-confirmed.
    orchestration:
      parentTaskPolicy: none
      suggestedChildTasks: []
    stageIndependent: true
    supportedProjectScopes:
    - project_instance
fields:
  input:
  - key: company_name
    name: Company Name
    fieldType: string
    required: true
    position: 0
    config: {}
  - key: organisation_id
    name: Confirmed Organisation ID
    fieldType: string
    required: false
    position: 1
    config: {}
  - key: meeting_record_artifact_ids
    name: Meeting Source Files
    fieldType: string
    required: false
    position: 2
    config: {}
  - key: meeting_notes
    name: Meeting Notes
    fieldType: richtext
    required: false
    position: 3
    config: {}
  - key: meeting_type
    name: Meeting Type
    fieldType: string
    required: false
    position: 4
    config: {}
  - key: meeting_datetime
    name: Meeting Date and Time
    fieldType: string
    required: false
    position: 5
    config: {}
  - key: meeting_goal
    name: Meeting Goal
    fieldType: string
    required: false
    position: 6
    config: {}
  - key: attendees
    name: Attendees
    fieldType: string
    required: false
    position: 7
    config: {}
  - key: pitch_deck_artifact_id
    name: Pitch Deck
    fieldType: file
    required: false
    position: 8
    config: {}
  output:
  - key: meeting_brief_artifact_id
    name: Meeting Brief
    fieldType: file
    required: true
    position: 0
    config:
      documentRefId: vc.document.initial_call_brief_template
runtime:
  defaultExecutionContext:
    sourceMetadata:
      templateFamily: vc-workflows
      taskKind: prepare_pipeline_meeting
  requiredResources:
    requiresTaskChat: true
  executionProfile:
    agentStartsImmediately: true
    requiresHumanConfirmationToComplete: true
    preferredMode: guided_execution
    preferredAgentType: vc_deal_analyst
ui:
  renderer: generic
  surfaceKey: null
  frameRef: null
