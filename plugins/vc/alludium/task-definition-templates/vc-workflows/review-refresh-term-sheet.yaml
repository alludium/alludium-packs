kind: task-definition-template
apiVersion: alludium/v1alpha1
id: vc.review_refresh_term_sheet
version: 1.0.3
title: Review or Refresh Term Sheet
category: Venture Capital
visibility: workspace
tags: [vc, term-sheet, living-document]
definition:
  name: Review or Refresh Term Sheet
  slug: review-refresh-term-sheet
  description: Review or refresh the living Term Sheet Review for one Deal at any active stage, comparing the prior source when available.
  allowSubtasks: false
  definitionJson:
    vertical: vc
    stageIndependent: true
    taskFamily: term_sheet
    documentRefs:
      - {documentId: vc.document.deal_pipeline_term_sheet_review_policy, usage: policy}
      - {documentId: vc.document.deal_pipeline_term_sheet_review_template, usage: output_template, outputFieldKey: term_sheet_review_artifact_id}
      - {documentId: vc.document.evidence_citation_style_guide, usage: style_guide}
      - {documentId: vc.document.template_use_guidance, usage: operating_guidance}
    requiredSkills: [generate-or-refresh-living-report, deal-terms-analysis, term-sheet-negotiation-brief, citation-enforcement]
    plannedRecommendedAgentTemplate: vc_deal_analyst
    recommendedAgentTemplate: vc_deal_analyst
    supportedProjectTypes: [vc_deal_pipeline]
    supportedProjectScopes: [project_instance]
    instructions:
      executionInstructions: >-
        Apply `generate-or-refresh-living-report` to discover the current project-linked evidence corpus, include the mapped current and previous term sheets, Evaluation Report, IC Memo and any additive `focus_artifact_ids`, compare the prior evidence basis when refreshing, and preserve the report lifecycle. On refresh, read the existing report only as the comparison baseline and create one new complete report; never edit the earlier report, which stays unchanged as history. Use `definitionJson.documentRefs` as the durable policy, template, style, and operating-guidance contract. Review the current term sheet against the Term Sheet Review Policy. Cover economics, liquidation, dilution, governance and control, founder obligations, exit rights, conditions, and process. When `previous_term_sheet_artifact_id` is supplied, compare it directly with the current source and explain every material change. State implications for the Evaluation Report, IC Memo, conditions, and reapproval. Identify counsel questions, do not present legal advice, render from the Term Sheet Review Template, and return the resulting artifact ID as `term_sheet_review_artifact_id`.
        The company under review is the Deal's confirmed Organisation. `company_name` carries that Organisation's name as the Platform supplied it to this task, and `organisation_id`, when present, identifies it for tool calls only. Do not ask the user to re-enter or confirm a company name, and do not take the company name from the Deal title, which is the opportunity's own name and may differ.
        Keep the Deal fields current with the Platform Record Field Maintenance skill: read them with `field-values.getFields`, use `field-values.setField` to fill editable empty Deal fields that the evidence in this task clearly supports, and suggest rather than make any change to a populated field. Leave the Fund, lifecycle stage and decision fields, and all People and Organisation records, to the human and the Deal Manager. In the completion summary, name each field you filled or suggest changing by its label. For a suggested change, give the current value and the value the evidence supports, and ask whether to update it; a yes from the human is an explicit request to write it.
      missingInputPolicy: Require a readable current term sheet; treat a missing prior version as no comparison baseline, not as no change.
      externalActionPolicy: Do not negotiate, send messages, make legal conclusions, record a decision, create tasks or projects, or move stage.
      completionCriteria:
        - The current source is cited and the prior source is compared when supplied.
        - Material deviations, red lines, implications, and counsel questions are explicit.
        - The shared living-report lifecycle and evidence-basis manifest contract is satisfied.
        - The resulting ID is saved to term_sheet_review_artifact_id.
    humanDecisionPoints:
      - Approve negotiation posture, legal instructions, reapproval, and any investment decision separately.
fields:
  input:
    - {key: company_name, name: Company Name, fieldType: string, required: true, position: 0, config: {description: "Name of the Deal's confirmed Organisation."}}
    - {key: current_term_sheet_artifact_id, name: Current Term Sheet, fieldType: file, required: true, position: 1, config: {}}
    - {key: previous_term_sheet_artifact_id, name: Previous Term Sheet, fieldType: file, required: false, position: 2, config: {}}
    - {key: evaluation_report_artifact_id, name: Evaluation Report, fieldType: file, required: false, position: 3, config: {}}
    - {key: ic_memo_artifact_id, name: IC Memo, fieldType: file, required: false, position: 4, config: {}}
    - {key: focus_artifact_ids, name: Focus Artifact IDs, fieldType: string, required: false, position: 5, config: {description: "Optional sources to emphasize in addition to all readable project-linked evidence."}}
    - {key: existing_term_sheet_review_artifact_id, name: Existing Term Sheet Review, fieldType: file, required: false, position: 6, config: {}}
    - {key: organisation_id, name: Confirmed Organisation ID, fieldType: string, required: false, position: 7, config: {description: "Confirmed investment-subject Organisation, for tool calls only."}}
  output:
    - key: term_sheet_review_artifact_id
      name: Term Sheet Review
      fieldType: file
      required: true
      position: 0
      config: {documentRefId: vc.document.deal_pipeline_term_sheet_review_template}
runtime:
  defaultExecutionContext:
    sourceMetadata: {templateFamily: vc-workflows, taskKind: term_sheet_review}
  requiredResources: {requiresTaskChat: true}
  executionProfile: {agentStartsImmediately: true, requiresHumanConfirmationToComplete: true, preferredMode: guided_execution, preferredAgentType: vc_deal_analyst}
ui: {renderer: generic, surfaceKey: null, frameRef: null}
