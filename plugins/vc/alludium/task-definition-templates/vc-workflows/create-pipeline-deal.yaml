kind: task-definition-template
apiVersion: alludium/v1alpha1
id: vc.create_pipeline_deal
version: 1.0.3
title: Create Pipeline Deal
category: Venture Capital
visibility: workspace
tags: [vc, deal-pipeline, project-creation]
definition:
  name: Create Pipeline Deal
  slug: create-pipeline-deal
  description: Gather the minimum reviewed identity, source, and Fund context needed to create one simplified VC Deal Pipeline project.
  allowSubtasks: false
  definitionJson:
    vertical: vc
    stage: setup
    taskFamily: deal_pipeline_project_creation
    documentRefs:
      - documentId: vc.document.evidence_citation_style_guide
        usage: style_guide
    requiredSkills:
      - company-research-and-enrichment
      - citation-enforcement
    plannedRecommendedAgentTemplate: vc_deal_pipeline_manager
    recommendedAgentTemplate: vc_deal_pipeline_manager
    supportedProjectTypes: [vc_deal_pipeline]
    supportedProjectScopes: [project_instance]
    instructions:
      executionInstructions: >-
        Use `definitionJson.documentRefs` as the durable style contract. Identify one company from the supplied chat, domain, deck, source link, or artifact. Preserve source provenance, distinguish verified facts from assumptions, and capture only confidently supported optional fields. A Fund is optional at creation; when supplied, require an exact active `vc.funds` id and never infer or blend mandates. Do not create the project directly: the platform finalizer owns deterministic creation after human approval. Creation must not trigger initial-state tasks.
        First read `projectCreation.projectTypeVersion` in the Resolved Task Context. It is the Deal setup this task was started on, not a value you produce. If it is a 1.0.x version with x below 7, this task was started before Deals recorded their company as an Organisation, and that Deal setup can no longer create a Deal. Do not produce a creation payload or complete the task: tell the user in one sentence that the Deal setup has changed and they should start the Deal again from New deal, then stop.
        The Deal's company is a confirmed Organisation, recorded in `projectCreation.identityLink` with `recordType: organisation` and `roleKey: deal_company`. Reuse an existing Organisation (`mode: reuse`, `recordId`) only with the exact Organisation ID that a Platform identity lookup returned and the user selected; a matching name is never a reuse. When a reused Organisation already has Deals, include `projectCreation.existingDealAcknowledgement` with the `organisationId` and `matchFingerprint` returned by `project.listInvestmentSubjectDeals`, and only after the user has seen those Deals and confirmed a separate Deal. Otherwise create a minimal Organisation (`mode: create`, `displayName`) from the company name alone; do not invent a domain, website, or logo. If you cannot look up existing Organisations, tell the user that a new Organisation record will be created under that name before you complete.
        Set `projectCreation.name` to the Deal title. Default it to the Organisation's name unless the user gave a different title; the title is the opportunity's own name and does not rename the Organisation. Never put `company_name`, `company_domain`, or `company_logo_url` in `projectCreation.fieldValues`.
      missingInputPolicy: Ask only when the company cannot be identified confidently from the available context, or when it is unclear whether an existing Organisation is the same company.
      externalActionPolicy: Do not send messages, write CRM records, create projects, create tasks, or move lifecycle state.
      completionCriteria:
        - The company identity is explicit and source context is preserved.
        - The output contains projectCreation.name and exactly one projectCreation.identityLink that reuses a user-selected Organisation by ID or creates a minimal Organisation.
        - The output carries no legacy company fields in projectCreation.fieldValues.
        - Any supplied Fund is an exact active configured Fund id.
        - A task started on a Deal setup version 1.0.x with x below 7 produces no creation payload and tells the user to start the Deal again from New deal.
    humanDecisionPoints:
      - Approve creation of the Deal Pipeline project and its reviewed fields.
fields:
  input:
    - {key: company_name, name: Company Name, fieldType: string, required: false, position: 0, config: {description: "Suggested company name. A suggestion is not a confirmed Organisation."}}
    - {key: company_domain, name: Company Domain, fieldType: string, required: false, position: 1, config: {description: "Suggested company domain, used only to help identify the Organisation."}}
    - {key: fund_id, name: Confirmed Fund ID, fieldType: string, required: false, position: 2, config: {}}
    - {key: source_artifact_ids, name: Source Artifact IDs, fieldType: string, required: false, position: 3, config: {}}
  output:
    - key: projectCreation
      name: Project Creation Payload
      fieldType: json
      required: true
      position: 0
      config:
        requiredPaths: [name, identityLink]
runtime:
  defaultExecutionContext:
    sourceMetadata: {templateFamily: vc-workflows, taskKind: create_pipeline_deal}
  requiredResources: {requiresTaskChat: true}
  executionProfile:
    agentStartsImmediately: true
    preferredMode: guided_execution
    preferredAgentType: vc_deal_pipeline_manager
ui: {renderer: generic, surfaceKey: null, frameRef: null}
