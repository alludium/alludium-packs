kind: task-definition-template
apiVersion: alludium/v1alpha1
id: vc.refresh_live_deal_status_report
version: 1.0.2
title: Refresh Live Deal Status Report
category: Venture Capital
visibility: workspace
tags:
  - vc
  - deal-status
  - report
definition:
  name: Refresh Live Deal Status Report
  slug: refresh-live-deal-status-report
  description: Create or manually refresh the current evidence-backed live deal status report for one venture-capital opportunity at any deal stage.
  allowSubtasks: false
  definitionJson:
    vertical: vc
    stageIndependent: true
    taskFamily: evaluation
    documentRefs:
      - documentId: vc.document.live_deal_status_report_template
        usage: output_template
        outputFieldKey: live_deal_status_report_artifact_id
      - documentId: vc.document.investment_diligence_question_framework
        usage: methodology
      - documentId: vc.document.evidence_citation_style_guide
        usage: style_guide
      - documentId: vc.document.template_use_guidance
        usage: operating_guidance
    requiredSkills:
      - citation-enforcement
      - investment-diligence-question-framework
    plannedRecommendedAgentTemplate: vc_evaluation_analyst
    recommendedAgentTemplate: vc_evaluation_analyst
    supportedProjectTypes:
      - vc_deal_room
    instructions:
      executionInstructions: >-
        Create or refresh the current Live Deal Status Report from the supplied source artifacts and every relevant READY Deal Pipeline file available in the task chat. Begin source discovery with `artifact.getArtifactsForChatContext` for the current task chat so the evidence inventory includes both directly attached files and project-shared files inherited by the chat. This is the report only: include Snapshot, Product, Technology, Market, Business model, Go-to-market, Competition, Team, Financials, Deal, and Open questions. Do not include the separate evidence ledger, human posture, votes, or decision record. Cite material claims inline, distinguish company claims from corroborated evidence, label inference and investor judgment, preserve material conflicts, and state missing information plainly.

        Resolve the report Fund from the supplied project `fund_id` and the canonical `vc.funds` records available to the recommended agent. Match by exact stable-ID equality only. When exactly one matching record has `status: actively_investing`, show `Fund: <resolved Fund name>` prominently in the visible report metadata and Snapshot. The Fund-fit section must use only that Fund's configured thesis, stage, sectors, geographies, minimum and maximum check size, currency, exclusions, and scoring framework. Treat those fields as the configured decision frame, not as Deal evidence or proof that the company satisfies the mandate. Never infer a Fund from company details, report text, display name, lifecycle stage, or nearest apparent mandate; never substitute another active Fund or blend Fund records.

        If `fund_id` is missing, show `Fund: Unassigned`, state that assignment is unresolved, and make no Fund-relative fit claim. If the stored ID matches no configured record, show `Fund: Unknown (<stored id>)`, make no Fund-relative fit claim, and flag assignment or configuration correction. If it matches a record whose status is not `actively_investing`, show `Fund: <resolved Fund name> (inactive)`, make no active-mandate fit claim, and flag correction. If no Funds are configured, show `Fund: Unassigned`, state that Fund setup is incomplete, and make no Fund-relative fit claim. Do not select or persist `fund_id` during this task.

        Use `definitionJson.documentRefs` as the durable source guidance for this output. Render one complete standalone safe static HTML artifact using the CSS-only tab pattern in `vc.document.live_deal_status_report_template`. The tabs must be ordinary fragment links backed by CSS `:target` selectors. Do not use JavaScript, forms, iframes, event handlers, external scripts, or external stylesheets. Follow Template Use Guidance for the shared token aliases, structural classes, source discipline, and pre-save HTML QA. The first visible tab must be Snapshot. Open questions must be grouped by area and include topic or sector labels where useful, priority, decision relevance, evidence needed, owner, and status. Do not invent generic questions merely to fill the table.

        This is a general Deal Pipeline task and must remain runnable at every lifecycle stage. The project mapping supplies the project's current report artifact as `existing_live_deal_status_report_artifact_id` when one exists. If that ID is supplied, this is a regeneration. Read that artifact's source metadata, then call `artifact.updateTextArtifact` with the same artifact ID, the complete replacement HTML, and the observed source revision number and content hash. Do not create a replacement artifact, change the artifact identity, or create a duplicate with the same filename. If the supplied artifact cannot be read or updated, stop and explain the problem instead of creating a duplicate.

        If `existing_live_deal_status_report_artifact_id` is not supplied, this is the first generation. Create exactly one project-shared HTML artifact with `artifact.createTextArtifact`, a clear `.html` filename, `mimeType: "text/html"`, and complete HTML beginning with `<!doctype html>`.

        In both cases, save the created or updated artifact ID to the required output field `live_deal_status_report_artifact_id`. The output ID is the ID that must be supplied as `existing_live_deal_status_report_artifact_id` on the next manual refresh. Keep detailed report content inside the HTML artifact rather than duplicating it in task output fields.

        Also save a compact JSON array to the required output field `open_questions`. This is a machine-actionable index for reviewed follow-up, not a second copy of the report narrative. Each item must contain `id`, `question`, `area`, `priority`, `evidenceNeeded`, `suggestedOwnerRole`, `status`, and `sourceRefs`. Use only the configured vocabularies in the field schema. Keep the array to at most 50 decision-relevant items and keep each string concise.

        Derive questions only from evidence gaps, material conflicts, blocked work, or explicitly unresolved decisions supported by sources you actually read. `sourceRefs` may contain only real artifact IDs, task IDs, or supplied source anchors. Use a deterministic stable `id` derived from the normalized underlying question area and evidence need; never use an array index, timestamp, or random UUID. Preserve the same ID across refreshes when the underlying need is unchanged. When a previously reported question is demonstrably answered or superseded, retain it only when useful for the refresh delta and set the corresponding status rather than creating a near-duplicate. If there are no supported questions, save `[]`. Never invent generic questions to fill the output.

        `suggestedOwnerRole` is advisory only. Do not put a fabricated person ID, agent ID, or guessed name in it. This report must not create, assign, or update tasks. Deal Manager may later compare these stable questions with existing work and present a predefined or ad-hoc task proposal, but a human must approve model-generated task creation and assignment separately.
      missingInputPolicy: Use the evidence currently available and mark unsupported sections or claims as unknown. Ask only when no company identity or readable source material is available.
      externalActionPolicy: Do not send messages, mutate CRM records, create folders or projects, create child tasks, move stages, or record an investment decision.
      completionCriteria:
        - The report is a standalone HTML artifact with eleven CSS-only report tabs and no JavaScript.
        - Material claims are cited or clearly labelled as company claim, inference, assumption, or investor judgment.
        - Missing information and open questions are explicit and decision-relevant.
        - The visible report shows the resolved Fund name or an explicit unassigned, unknown, or inactive state.
        - Fund fit uses only the exact active `vc.funds` record matched by the Deal's `fund_id`; unresolved states produce no Fund-relative fit claim.
        - A first run creates one artifact; a regeneration updates the supplied artifact without changing its ID.
        - The resulting artifact ID is saved to `live_deal_status_report_artifact_id`.
        - A bounded structured question index is saved to `open_questions`, with stable IDs and only verified source references; an empty array is valid.
        - The report creates or assigns no follow-up tasks.
    humanDecisionPoints:
      - Confirm the report is an analytical synthesis and does not record a human investment decision.
      - Review any task proposal derived later from structured report questions before creation or assignment.
      - Approve any separate external communication, CRM write, stage movement, or investment decision outside this task.
    orchestration:
      mode: manual_suggestion
      parentTaskPolicy: none
      suggestedChildTasks: []
fields:
  input:
    - key: company_name
      name: Company Name
      fieldType: string
      required: true
      position: 0
      config: {}
    - key: fund_id
      name: Confirmed Fund ID
      fieldType: string
      required: false
      position: 1
      config: {}
    - key: existing_live_deal_status_report_artifact_id
      name: Existing Live Deal Status Report
      fieldType: file
      required: false
      position: 2
      config: {}
    - key: source_artifact_ids
      name: Additional Source Artifact IDs
      fieldType: string
      required: false
      position: 3
      config: {}
  output:
    - key: live_deal_status_report_artifact_id
      name: Live Deal Status Report
      fieldType: file
      required: true
      position: 0
      config:
        documentRefId: vc.document.live_deal_status_report_template
    - key: open_questions
      name: Structured Open Questions
      fieldType: json
      required: true
      position: 1
      config:
        description: Compact stable question index for reviewed Deal Manager task proposals; detailed narrative remains in the report artifact.
        schema:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - question
              - area
              - priority
              - evidenceNeeded
              - suggestedOwnerRole
              - status
              - sourceRefs
            properties:
              id:
                type: string
                maxLength: 160
              question:
                type: string
                maxLength: 500
              area:
                type: string
                enum:
                  - product
                  - technology
                  - market
                  - business_model
                  - go_to_market
                  - competition
                  - team
                  - financial
                  - deal
                  - legal
                  - fund_fit
                  - other
              priority:
                type: string
                enum:
                  - critical
                  - high
                  - medium
                  - low
              evidenceNeeded:
                type: string
                maxLength: 500
              suggestedOwnerRole:
                type: string
                maxLength: 160
              status:
                type: string
                enum:
                  - open
                  - blocked
                  - answered
                  - superseded
              sourceRefs:
                type: array
                maxItems: 20
                items:
                  type: string
                  maxLength: 240
runtime:
  defaultExecutionContext:
    sourceMetadata:
      templateFamily: vc-workflows
      taskKind: refresh_live_deal_status_report
  requiredResources:
    requiresTaskChat: true
  executionProfile:
    agentStartsImmediately: true
    requiresHumanConfirmationToComplete: true
    preferredMode: guided_execution
    preferredAgentType: vc_evaluation_analyst
ui:
  renderer: generic
  surfaceKey: null
  frameRef: null
