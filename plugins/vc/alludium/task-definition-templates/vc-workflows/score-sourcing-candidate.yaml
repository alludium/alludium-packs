kind: task-definition-template
apiVersion: alludium/v1alpha1
id: vc.score_sourcing_candidate
version: 0.1.15
title: Score Sourcing Candidate
category: Venture Capital
visibility: workspace
tags:
- vc
- origination
- scoring
definition:
  name: Score Sourcing Candidate
  slug: score-sourcing-candidate
  description: Produce a Fund-specific Meet/Watch/Pass verdict and urgency score for one Candidate in one Sourcing Line context.
  allowSubtasks: false
  definitionJson:
    vertical: vc
    stage: score
    taskFamily: origination_scoring
    documentRefs:
    - documentId: vc.document.sourcing_scoring_rubric
      usage: methodology
      outputFieldKey: scoring_artifact_id
    - documentId: vc.document.origination_source_strategy_guide
      usage: methodology
    - documentId: vc.document.template_use_guidance
      usage: operating_guidance
    requiredSkills:
    - vc-sourcing-verdict-and-screening
    - vc-sourcing-dedupe-and-novelty-check
    - citation-enforcement
    recommendedAgentTemplate: vc_sourcing_operator
    plannedRecommendedAgentTemplate: vc_sourcing_operator
    supportedProjectTypes:
    - vc_origination_candidate
    supportedProjectScopes:
    - project_instance
    instructions:
      executionInstructions: 'Require explicit `candidate_project_id`, `sourcing_line_project_id`, `candidate_line_relationship_id`,
        and `fund_id` before scoring. Read the Candidate and relationship, then call `project.getAgentContext` with the exact
        `sourcing_line_project_id` and read the current `fund_id` entry from its returned `fieldValues`; do not use the raw
        project row or task-seeded context for this mutable field. Confirm the relationship is active, has type
        `vc.sourcing_line_originated_candidate`, and runs from that exact line to that exact Candidate. Confirm the current
        persisted line `fund_id` equals the supplied ID, then require exact stable-ID equality with one rendered canonical
        `vc.funds` record whose status is `actively_investing`. Apply that matched record''s `stage`, `sectors`, `geographies`,
        `thesis`, `minimumCheckSize`, `maximumCheckSize`, `currency`, `exclusions`, and `scoringFramework`; never score from
        another Fund. Every populated matched Fund field is authoritative. Use the generic Pack rubric and optional reviewed
        task `scoring_policy` only to supply missing, non-conflicting detail; never override or weaken a populated matched Fund
        field. Mirror the reference pipeline''s
        verdict contract using that Fund and line policy. Score from already-enriched data, separate evidence from inference,
        and return Meet, Watch, or Pass plus urgency. Apply hard stage safety by passing companies with Series A+ funding or
        more than 20 employees when reliable LinkedIn company data is present, unless the matched Fund''s populated stage,
        thesis, or scoring framework explicitly allows that later stage or company size. Run the second-pass verdict only for Meet/Watch
        rows with fresh LinkedIn company data so paid scraping and model cost stay bounded. After producing the scoring artifact,
        read the relationship again and call `project-relationship.updateMetadata` once. Because that operation replaces
        metadata, copy every existing key and every existing `scoring_by_fund` entry unchanged, then set only
        `scoring_by_fund[fund_id]` to an object containing `schema_version: vc.sourcing_line_candidate_scoring.v1`, the exact
        Candidate, line, relationship and Fund IDs, `scoring_artifact_id`, `candidate_score`, `review_verdict`,
        `thesis_fit_summary`, `scored_at`, and the current task ID. Never write these Fund-relative values to Candidate-wide
        project fields. Use `definitionJson.documentRefs` as the durable document reference contract. Apply each reference by
        usage: `output_template` sets the output skeleton, `methodology` supplies scoring or analysis logic, `checklist` must
        be completed with status, evidence, and owner, `style_guide` governs citations and claim language, and
        `operating_guidance` or `policy` constrains process and approval boundaries. For refs with `outputFieldKey`, produce
        that output from the referenced pack document and preserve the document ID alongside the output artifact.'
      missingInputPolicy: Keep scoring incomplete until the exact Candidate project, Sourcing Line project, active provenance
        relationship, active Fund, enriched evidence, line/Fund policy, LinkedIn data availability, and scoring thresholds are
        available and mutually consistent.
      externalActionPolicy: 'The only allowed persistent mutation is replacing metadata on the verified line-candidate
        relationship while preserving all prior metadata and other Fund entries. Do not update Candidate-wide score fields,
        sync external records, change manual decisions, send outreach, or create Deal Pipelines.'
      completionCriteria:
      - The exact Candidate, Sourcing Line, active provenance relationship, and actively-investing Fund are recorded and verified.
      - The scored candidate has action, urgency, thesis fit, confidence, funding status, HQ/geography concern, frontier-pedigree
        evidence, reasons, and receipts for that exact line/Fund context.
      - Auto-pass decisions name the specific rule and evidence.
      - Second-pass rows are limited to candidates with fresh LinkedIn company data.
      - The terminal platform receipt confirms the result was stored only at `relationship.metadata.scoring_by_fund[fund_id]`
        without removing prior metadata or another Fund entry.
fields:
  input:
  - key: candidate_project_id
    name: Candidate Project ID
    fieldType: string
    required: true
    position: 0
    config: {}
  - key: sourcing_line_project_id
    name: Sourcing Line Project ID
    fieldType: string
    required: true
    position: 1
    config: {}
  - key: candidate_line_relationship_id
    name: Candidate-Line Relationship ID
    fieldType: string
    required: true
    position: 2
    config: {}
  - key: fund_id
    name: Fund ID
    fieldType: string
    required: true
    position: 3
    config: {}
  - key: enriched_candidate_batch
    name: Enriched Candidate Batch
    fieldType: json
    required: true
    position: 4
    config: {}
  - key: scoring_policy
    name: Scoring Policy
    fieldType: json
    required: false
    position: 5
    config: {}
  output:
  - key: scoring_artifact_id
    name: Scoring Artifact
    fieldType: file
    required: true
    position: 0
    config:
      documentRefId: vc.document.sourcing_scoring_rubric
  - key: meet_candidate_count
    name: Meet Candidate Count
    fieldType: number
    required: false
    position: 1
    config: {}
  - key: watch_candidate_count
    name: Watch Candidate Count
    fieldType: number
    required: false
    position: 2
    config: {}
  - key: promotion_ready_count
    name: Promotion Ready Count
    fieldType: number
    required: false
    position: 3
    config: {}
  - key: scoring_report
    name: Scoring Report
    fieldType: richtext
    required: false
    position: 4
    config:
      rows: 8
  - key: candidate_score
    name: Candidate Score
    fieldType: number
    required: false
    position: 5
    config: {}
  - key: review_verdict
    name: Review Verdict
    fieldType: select
    required: false
    position: 6
    options:
    - value: meet
      label: Meet
    - value: watch
      label: Watch
    - value: pass
      label: Pass
    - value: needs_review
      label: Needs Review
    config: {}
  - key: thesis_fit_summary
    name: Thesis Fit Summary
    fieldType: richtext
    required: false
    position: 7
    config:
      rows: 6
  - key: relationship_scoring_persisted
    name: Relationship Scoring Persisted
    fieldType: boolean
    required: true
    position: 8
    config: {}
