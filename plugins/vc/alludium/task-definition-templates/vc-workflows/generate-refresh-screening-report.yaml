kind: task-definition-template
apiVersion: alludium/v1alpha1
id: vc.generate_refresh_screening_report
version: 1.0.0
title: Generate or Refresh Screening Report
category: Venture Capital
visibility: workspace
tags: [vc, screening, living-document]
definition:
  name: Generate or Refresh Screening Report
  slug: generate-refresh-screening-report
  description: Generate or refresh the compact evidence-backed Screening Report for one Deal at any active stage.
  allowSubtasks: false
  definitionJson:
    vertical: vc
    stageIndependent: true
    taskFamily: screening
    documentRefs:
      - {documentId: vc.document.deal_pipeline_screening_criteria, usage: methodology}
      - {documentId: vc.document.deal_pipeline_screening_report_template, usage: output_template, outputFieldKey: screening_report_artifact_id}
      - {documentId: vc.document.evidence_citation_style_guide, usage: style_guide}
      - {documentId: vc.document.template_use_guidance, usage: operating_guidance}
    requiredSkills: [generate-or-refresh-living-report, investment-screening-framework, citation-enforcement]
    plannedRecommendedAgentTemplate: vc_deal_analyst
    recommendedAgentTemplate: vc_deal_analyst
    supportedProjectTypes: [vc_deal_pipeline]
    supportedProjectScopes: [project_instance]
    instructions:
      executionInstructions: >-
        Apply `generate-or-refresh-living-report` to discover the current project-linked evidence corpus, include any additive `focus_artifact_ids`, compare the prior evidence basis when refreshing, and preserve the report lifecycle. Use `definitionJson.documentRefs` as the durable criteria, template, style, and operating-guidance contract. Apply the source-neutral Screening Criteria and keep the report compact and decision-oriented. Use the exact active `vc.funds` record matching `fund_id` only as a separate Fund-fit frame. Cite material claims, mark unknowns, render from the Screening Report Template, and return the resulting artifact ID as `screening_report_artifact_id`. Do not record a human investment decision or move stage.
      missingInputPolicy: Use available evidence and mark unsupported factors unknown; ask only when company identity or readable source material is absent.
      externalActionPolicy: Do not send messages, mutate CRM, create tasks or projects, move stage, or record an investment decision.
      completionCriteria:
        - All material screening dimensions are addressed without filler and material claims are cited.
        - Fund fit is separate and uses only the exact active configured Fund.
        - The shared living-report lifecycle and evidence-basis manifest contract is satisfied.
        - The resulting ID is saved to screening_report_artifact_id.
    humanDecisionPoints:
      - Review the analyst recommendation and make any pass or continue decision separately.
fields:
  input:
    - {key: company_name, name: Company Name, fieldType: string, required: true, position: 0, config: {}}
    - {key: fund_id, name: Confirmed Fund ID, fieldType: string, required: false, position: 1, config: {}}
    - {key: focus_artifact_ids, name: Focus Artifact IDs, fieldType: string, required: false, position: 2, config: {description: "Optional sources to emphasize in addition to all readable project-linked evidence."}}
    - {key: existing_screening_report_artifact_id, name: Existing Screening Report, fieldType: file, required: false, position: 3, config: {}}
  output:
    - key: screening_report_artifact_id
      name: Screening Report
      fieldType: file
      required: true
      position: 0
      config: {documentRefId: vc.document.deal_pipeline_screening_report_template}
runtime:
  defaultExecutionContext:
    sourceMetadata: {templateFamily: vc-workflows, taskKind: screening_report}
  requiredResources: {requiresTaskChat: true}
  executionProfile: {agentStartsImmediately: true, requiresHumanConfirmationToComplete: true, preferredMode: guided_execution, preferredAgentType: vc_deal_analyst}
ui: {renderer: generic, surfaceKey: null, frameRef: null}
