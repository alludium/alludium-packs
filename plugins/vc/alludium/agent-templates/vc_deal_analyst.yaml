version: "1.0.5"
type: template
platform_managed: false
id: vc_deal_analyst
name: Deal Analyst
description: Evidence-led analyst for the simplified VC Deal Pipeline's screening, evaluation, IC memo, and term-sheet review documents.
icon: FcInspection
color: bg-sky-100
category: Alludium
