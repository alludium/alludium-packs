  gitRepositoryUrl: https://github.com/alludium-templates/configurable-agent.git
  supportedTaskDefinitions:
    - generate-refresh-screening-report
    - generate-refresh-evaluation-report
    - prepare-refresh-ic-memo
    - review-refresh-term-sheet
  primaryStage: Evaluation
  primaryDealRoomState: evaluation
  requiredSkills:
    - generate-or-refresh-living-report
    - investment-screening-framework
    - investment-diligence-question-framework
    - market-map-building
    - commercial-evaluation-and-market-risk
    - technical-evaluation-and-product-risk
    - financial-evaluation-and-financing-risk
    - team-evaluation-and-founder-risk
    - red-flags-scanner
    - ic-memo-assembly
    - ic-risk-checklist-and-decision-log
    - deal-terms-analysis
    - term-sheet-negotiation-brief
    - citation-enforcement

capabilityProfile:
  baseline: NONE
  bundles:
    - PLATFORM_TOOL_REPOSITORY
    - PROJECT_CONTEXT_READ
    - TASK_OUTPUT_SAVE
    - PROJECT_MANAGER_HANDOFF
    - FILE_AUTHORING
    - FILE_FULL_REWRITE
    - WEB_SEARCH

capabilityAccess:
  tools:
    policy: ALL_CONNECTED_APPS
    connectedApplicationExecutionMode: READ_ONLY

skills:
  - externalId: generate-or-refresh-living-report
    activationMode: ALWAYS
  - externalId: investment-screening-framework
    activationMode: AUTO
  - externalId: investment-diligence-question-framework
    activationMode: AUTO
  - externalId: market-map-building
    activationMode: AUTO
  - externalId: commercial-evaluation-and-market-risk
    activationMode: AUTO
  - externalId: technical-evaluation-and-product-risk
    activationMode: AUTO
  - externalId: financial-evaluation-and-financing-risk
    activationMode: AUTO
  - externalId: team-evaluation-and-founder-risk
    activationMode: AUTO
  - externalId: red-flags-scanner
    activationMode: AUTO
  - externalId: ic-memo-assembly
    activationMode: AUTO
  - externalId: ic-risk-checklist-and-decision-log
    activationMode: AUTO
  - externalId: deal-terms-analysis
    activationMode: AUTO
  - externalId: term-sheet-negotiation-brief
