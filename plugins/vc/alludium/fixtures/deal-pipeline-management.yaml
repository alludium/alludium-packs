schemaVersion: "0.1"
description: Representative Deal Manager, Pipeline Manager, and Live Deal Status Report coordination states.

dealManagerScenarios:
  - id: compact-context-with-confirmed-fund
    context:
      lifecycleStage: evaluation
      leadOwner: partner-1
      round: Seed
      fundraisingAsk: 3000000
      fundId: europe-seed
      crmSourceUrl: https://example.invalid/opportunities/42
      openTaskCount: 2
      latestReportArtifactId: artifact-report-1
    expected:
      progressivelyReadDetails: true
      eagerlyRenderAllFunds: false
      useExactFundId: europe-seed

  - id: predefined-task-match
    userRequest: Refresh the current eleven-tab Deal status report.
    availableTaskDefinitionSlugs:
      - refresh-live-deal-status-report
    expected:
      taskKind: predefined
      selectedTaskDefinitionSlug: refresh-live-deal-status-report
      approvalRequiredBeforeModelGeneratedCreation: true

  - id: approved-ad-hoc-financial-verification
    userRequest: Ask the finance lead to verify the pitch deck financial claims against source statements.
    availableTaskDefinitionSlugs:
      - refresh-live-deal-status-report
      - run-financial-evaluation
    resolvedMemberIds:
      - member-finance-1
    humanApproval:
      approvedTitle: Verify pitch deck financial claims
      approvedAssigneeId: member-finance-1
    expected:
      taskKind: ad_hoc
      assignmentTargetMustResolve: true
      readBackCreatedTask: true

  - id: report-questions-require-review
    latestReportQuestions:
      - id: financial-revenue-reconciliation
        question: Can claimed ARR be reconciled to source statements?
        area: financial
        priority: high
        evidenceNeeded: Revenue ledger and signed customer schedules
        suggestedOwnerRole: finance
        status: open
        sourceRefs:
          - artifact-report-1
    existingOpenTasks: []
    humanApproval: null
    expected:
      mayProposeTasks: true
      mayCreateTasks: false
      mayAssignTasks: false

pipelineManagerScenarios:
  - id: unassigned-fund-review
    navigationFilter:
      field: fund_id
      operator: isNull
    candidateDealIds:
      - deal-1
    expected:
      inspectSelectedDealsOnly: true
      rankRelevantActiveFunds: true
      mayPersistFundId: false

  - id: selected-fund-weekly-summary
    selectedFundId: europe-seed
    requestedPeriod: 7d
    expectedSections:
      - deal_movement
      - stalled_or_blocked_work
      - task_progress
      - decision_points
      - evidence_gaps
      - next_actions
    expected:
      includeScopeAndFreshness: true
      includeUnassignedDealsSeparately: true
      eagerlyReadEveryDeal: false

  - id: direct-chat-to-deal
    toolName: project.createFromChat
    sourceChatId: 2d5c7f18-6f0a-4f5d-9b75-6bf6d871b4c2
    idempotencyKey: pipeline-manager:example-labs:create:2026-08-14
    projectTypeKey: vc_deal_room
    userInstruction: Create a Deal for Example Labs from this conversation and use the attached deck.
    resolvedCompany:
      name: Example Labs
      domain: example.invalid
    confirmedFundId: null
    duplicateCandidates: []
    sourceLinks:
      - https://example.invalid/company
    sourceChatArtifacts:
      - source-note.md
    handoff:
      whyCreated: The user asked Pipeline Manager to add Example Labs to the Deal Pipeline.
      sourceSummary: Example Labs is raising a Seed round; source-note.md is the primary source.
      unresolvedQuestions:
        - Confirm the round target from source evidence.
    toolOnlyValues:
      sourceChatId: 2d5c7f18-6f0a-4f5d-9b75-6bf6d871b4c2
      projectId: 7f56a2d1-8c43-4b91-a6e0-2d93f4c5b718
      projectTypeVersionId: 91b7d4e2-3a68-4f25-8c10-5d6e7f8a9b20
      profileId: 4c8d1e73-2b90-4a65-9f31-7e5d6c4b3a21
      artifactId: 6a2f9c84-1d57-4b30-8e62-9c7d5a4b3f10
      messageId: 8b3e7d95-2c61-4a40-9f73-1d6e5c4b2a09
      operationId: create-example-labs-from-chat
      idempotencyKey: pipeline-manager:example-labs:create:2026-08-14
    serverReceipt:
      status: created
      project:
        id: 7f56a2d1-8c43-4b91-a6e0-2d93f4c5b718
        name: Example Labs
        projectTypeVersionId: 91b7d4e2-3a68-4f25-8c10-5d6e7f8a9b20
      linkedArtifacts:
        - filename: source-note.md
      action:
        type: open_project
        projectId: 7f56a2d1-8c43-4b91-a6e0-2d93f4c5b718
        label: Open Example Labs
    completeVisibleAssistantResponse: "Created Example Labs and linked source-note.md."
    renderedPlatformActions:
      - type: open_project
        projectId: 7f56a2d1-8c43-4b91-a6e0-2d93f4c5b718
        label: Open Example Labs
    expected:
      exactActionApproved: create
      mayExecuteBoundedMutation: true
      requiresProposalCard: false
      requiresReviewButton: false
      requiresModal: false
      requiresRedundantConfirmation: false
      preserveSourceChat: true
      requestIncludesArtifactIds: false
      serverDiscoversAndLinksSourceChatArtifacts: true
      structuredReceiptRequiredBeforeSuccess: true
      visibleReadbackSentenceLimit: 1
      visibleResponseContainsToolOnlyIdentifiers: false
      constructsNavigationLink: false
      usesReturnedPlatformActionExclusively: true
      duplicatesHandoffInSourceResponse: false
      handoffToAgentTemplateKey: vc_deal_manager
      handoffAuthor: Pipeline Manager
      handoffIncludesRawIds: false
      handoffIncludesTranscriptDump: false

  - id: missing-required-field-clarification
    sourceChatId: chat-2
    userInstruction: Create a Deal from this conversation.
    resolvedCompany:
      name: null
      domain: null
    expected:
      askOneFocusedQuestion: true
      unresolvedField: company_name
      mayExecuteBoundedMutation: false

  - id: duplicate-deal-ambiguity
    sourceChatId: chat-3
    userInstruction: Add Example Labs to the pipeline.
    resolvedCompany:
      name: Example Labs
      domain: example.invalid
    duplicateCandidates:
      - name: Example Labs
        dealUrl: https://example.invalid/deals/example-labs
    separateDealIntent: null
    expected:
      linkExistingDeal: true
      askOneFocusedQuestion: true
      mayExecuteBoundedMutation: false

  - id: bounded-deal-update
    toolName: project.applyPortfolioOperations
    userInstruction: Assign Example Labs to the Europe Seed Fund.
    targetDealUrl: https://example.invalid/deals/example-labs
    operation:
      operationId: update-example-labs-fund
      type: update_fields
      expectedProjectTypeVersionId: version-deal-room-1
      fieldValues:
        fund_id: europe-seed
    expected:
      exactActionApproved: update_allowlisted_fields
      revalidateActiveFundOption: true
      mayChangeLifecycleStage: false
      mayMakeInvestmentDecision: false
      readBackBeforeReceipt: true

  - id: bounded-archive-restore
    toolName: project.applyPortfolioOperations
    requests:
      - instruction: Archive Example Labs.
        targetDealUrl: https://example.invalid/deals/example-labs
        operation:
          operationId: archive-example-labs
          type: archive
          expectedProjectTypeVersionId: version-deal-room-1
      - instruction: Restore Example Labs.
        targetDealUrl: https://example.invalid/deals/example-labs
        operation:
          operationId: restore-example-labs
          type: restore
          expectedProjectTypeVersionId: version-deal-room-1
    expected:
      mayUseGenericProjectMutation: false
      readBackBeforeReceipt: true

  - id: multi-deal-partial-failure
    toolName: project.applyPortfolioOperations
    userInstruction: Archive Example Labs and Northstar.
    topLevelStatus: partial
    results:
      - operationId: archive-example-labs
        dealUrl: https://example.invalid/deals/example-labs
        status: succeeded
      - operationId: archive-northstar
        dealUrl: https://example.invalid/deals/northstar
        status: failed
        reason: permission_lost
    expected:
      reportPerDealResult: true
      mayClaimWholeRequestSuccess: false

reportFundScenarios:
  - id: confirmed-active-fund-report
    projectFundId: europe-seed
    matchingFund:
      id: europe-seed
      name: Europe Seed Fund
      status: actively_investing
    expected:
      displayedFundName: Europe Seed Fund
      fundFitSourceId: europe-seed
      mayBlendFunds: false
      mayMakeFundFitClaim: true

  - id: unassigned-fund-report
    projectFundId: null
    expected:
      displayedFundState: "Fund: Unassigned"
      mayMakeFundFitClaim: false
      mayPersistFundId: false

  - id: unknown-fund-report
    projectFundId: missing-fund
    expected:
      displayedFundState: "Fund: Unknown (missing-fund)"
      mayMakeFundFitClaim: false
      correctionRequired: true

  - id: inactive-fund-report
    projectFundId: legacy-opportunity
    matchingFund:
      id: legacy-opportunity
      name: Legacy Opportunity Fund
      status: closed_to_new_investments
    expected:
      displayedFundState: "Fund: Legacy Opportunity Fund (inactive)"
      mayMakeFundFitClaim: false
      correctionRequired: true

reportQuestionScenarios:
  - id: no-supported-questions
    previousQuestions: []
    currentEvidenceGaps: []
    expectedOpenQuestions: []

  - id: stable-question-across-refresh
    previousQuestions:
      - id: financial-revenue-reconciliation
        status: open
    currentEvidenceGaps:
      - area: financial
        evidenceNeeded: Revenue ledger and signed customer schedules
    expected:
      retainedQuestionId: financial-revenue-reconciliation
      createsDuplicate: false

  - id: question-covered-by-existing-task
    currentQuestionId: financial-revenue-reconciliation
    existingTaskIds:
      - task-finance-1
    expected:
      createDuplicateTask: false
      linkOrUpdateProposal: true

  - id: resolved-question
    previousQuestionId: financial-revenue-reconciliation
    evidenceNowSupportsAnswer: true
    expected:
      status: answered
      createReplacementQuestion: false
