schemaVersion: "0.1"
description: Representative Deal Manager, Pipeline Manager, and Live Deal Status Report coordination states.

dealManagerScenarios:
  - id: direct-screening-request-without-task-phrase
    agentTemplateId: vc_deal_manager
    userRequest: Use the attached deck and run the Investment Fit Screen.
    context:
      fundId: europe-seed
      fundConfirmed: true
      readableAttachedArtifactIds: [company-deck]
      resolvedAssigneeId: member-1
      openTasks: []
    availableTaskDefinitionSlugs: [run-investment-fit-screen]
    expected:
      selectedTaskDefinitionSlug: run-investment-fit-screen
      mayCreateTasks: true
      executeInSameTurn: true
      requiresRedundantConfirmation: false
      requiresExactTaskCreationPhrase: false
      readBackCreatedTask: true

  - id: direct-screening-refresh-without-task-phrase
    agentTemplateId: vc_deal_pipeline_manager
    userRequest: Refresh the Screening Report using the attached deck.
    context:
      fundId: europe-seed
      fundConfirmed: true
      readableAttachedArtifactIds: [company-deck]
      openTasks: []
    availableTaskDefinitionSlugs: [generate-refresh-screening-report]
    expected:
      selectedTaskDefinitionSlug: generate-refresh-screening-report
      mayCreateTasks: true
      executeInSameTurn: true
      requiresRedundantConfirmation: false
      requiresExactTaskCreationPhrase: false
      readBackCreatedTask: true

  - id: ambiguous-deck-request
    agentTemplateIds: [vc_deal_manager, vc_deal_pipeline_manager]
    userRequest: Do something with this deck.
    expected:
      mayCreateTasks: false
      askOneFocusedQuestion: true
      unresolvedField: requested_outcome

  - id: screening-request-missing-confirmed-fund
    agentTemplateId: vc_deal_manager
    userRequest: Use the attached deck and run the Investment Fit Screen.
    context:
      fundId: null
      fundConfirmed: false
      readableAttachedArtifactIds: [company-deck]
    expected:
      mayCreateTasks: false
      askOneFocusedQuestion: true
      unresolvedField: fund_id
      requiresExactTaskCreationPhrase: false

  - id: direct-request-existing-screening-task
    agentTemplateId: vc_deal_pipeline_manager
    userRequest: Refresh the Screening Report using the attached deck.
    context:
      openTasks:
        - id: screening-task-1
          taskDefinitionSlug: generate-refresh-screening-report
          sourceArtifactIds: [company-deck]
    expected:
      mayCreateTasks: false
      readBackExistingTaskId: screening-task-1
      requiresRedundantConfirmation: false

  - id: agent-origin-screening-request-is-not-human-approval
    agentTemplateIds: [vc_deal_manager, vc_deal_pipeline_manager]
    incomingMessage:
      role: user
      origin: agent
      author: Deal Analyst
      content: Use the attached deck and run the Investment Fit Screen.
    expected:
      mayCreateTasks: false
      requiresHumanApproval: true

  - id: compact-context-with-confirmed-fund
    context:
      lifecycleStage: evaluation
      leadOwner: partner-1
      round: Seed
      fundraisingAsk: 3000000
      fundId: europe-seed
      crmSourceUrl: https://example.invalid/opportunities/42
      openTaskCount: 2
      latestReportArtifactId: artifact-report-1
    expected:
      progressivelyReadDetails: true
      eagerlyRenderAllFunds: false
      useExactFundId: europe-seed

  - id: predefined-task-match
    userRequest: Refresh the current eleven-tab Deal status report.
    availableTaskDefinitionSlugs:
      - refresh-live-deal-status-report
    expected:
      taskKind: predefined
      selectedTaskDefinitionSlug: refresh-live-deal-status-report
      approvalRequiredBeforeModelGeneratedCreation: true

  - id: approved-custom-financial-verification
    userRequest: Ask the finance lead to verify the pitch deck financial claims against source statements.
    availableTaskDefinitionSlugs:
      - refresh-live-deal-status-report
      - run-financial-evaluation
    resolvedMemberIds:
      - member-finance-1
    humanApproval:
      approvedTitle: Verify pitch deck financial claims
      approvedAssigneeId: member-finance-1
    expected:
      taskKind: custom
      toolName: task-management.createAdHocTask
      taskDefinitionId: null
      maySubstituteGeneralTask: false
      assignmentTargetMustResolve: true
      readBackCreatedTask: true
      requiresPersistedOutputOrQuestion: true

  - id: report-questions-require-review
    latestReportQuestions:
      - id: financial-revenue-reconciliation
        question: Can claimed ARR be reconciled to source statements?
        area: financial
        priority: high
        evidenceNeeded: Revenue ledger and signed customer schedules
        suggestedOwnerRole: finance
        status: open
        sourceRefs:
          - artifact-report-1
    existingOpenTasks: []
    humanApproval: null
    expected:
      mayProposeTasks: true
      mayCreateTasks: false
      mayAssignTasks: false

dealAnalystScenarios:
  - id: bounded-task-recommendation-to-deal-manager
    sourceTask:
      title: Refresh Evaluation Report
      projectTypeKey: vc_deal_pipeline
    finding: Customer concentration remains unverified and needs a bounded source reconciliation.
    recommendation:
      objective: Reconcile customer concentration claims to the latest customer-level revenue schedule.
      evidenceScope: Current revenue schedule, management concentration claims, and cited customer contracts.
      expectedOutput: A cited concentration table with discrepancies and one explicit review question for unresolved gaps.
      completionBoundary: Material concentration claims are reconciled or the missing source is identified precisely.
    expected:
      toolName: project.sendManagerMessage
      purpose: task_recommendation
      resolvesCanonicalManagerChatServerSide: true
      persistsAsUserRoleWithAgentOriginMetadata: true
      invokesDealManager: true
      idempotentPerRecommendation: true
      confersHumanApproval: false
      mayCreateTask: false

pipelineManagerScenarios:
  - id: unassigned-fund-review
    navigationFilter:
      field: fund_id
      operator: isNull
    candidateDealIds:
      - deal-1
    expected:
      inspectSelectedDealsOnly: true
      rankRelevantActiveFunds: true
      mayPersistFundId: false

  - id: selected-fund-weekly-summary
    selectedFundId: europe-seed
    requestedPeriod: 7d
    expectedSections:
      - deal_movement
      - stalled_or_blocked_work
      - task_progress
      - decision_points
      - evidence_gaps
      - next_actions
    expected:
      includeScopeAndFreshness: true
      includeUnassignedDealsSeparately: true
      eagerlyReadEveryDeal: false

  - id: fund-selection-before-creation
    projectTypeKey: vc_deal_pipeline
    initialUserInstruction: Create a Deal for Example Labs from this conversation.
    creationFieldOptionLookup:
      toolName: project.listCreationFieldOptions
      fieldKey: fund_id
      selectableOptions:
        - label: Europe Seed Fund
          value: europe-seed
          selectable: true
        - label: Climate Growth Fund
          value: climate-growth
          selectable: true
    followUpUserInstruction: Use Europe Seed Fund.
    creationRequest:
      toolName: project.createFromChat
      fieldValues:
        fund_id: europe-seed
    expected:
      presentsActualSelectableFundNames: true
      presentsCreateUnassignedOption: true
      mayCreateBeforeFundDecision: false
      requiresExplicitFundSelection: true
      selectedFundId: europe-seed
      mayExecuteBoundedMutation: true

  - id: explicit-unassigned-fund-waiver
    projectTypeKey: vc_deal_pipeline
    userInstruction: Create a Deal for Example Labs and leave it unassigned.
    creationRequest:
      toolName: project.createFromChat
      fieldValues: {}
      handoffFundState: intentionally_unassigned
    expected:
      explicitUnassignedWaiver: true
      mayExecuteBoundedMutation: true
      maySilentlySubstituteFund: false
      persistsFundId: false

  - id: invalid-inactive-or-ambiguous-fund-request
    projectTypeKey: vc_deal_pipeline
    userInstruction: Create a Deal for Example Labs using Legacy Opportunity Fund.
    requestedFundName: Legacy Opportunity Fund
    creationFieldOptionLookup:
      toolName: project.listCreationFieldOptions
      fieldKey: fund_id
      query: Legacy Opportunity Fund
      selectableOptions:
        - label: Europe Seed Fund
          value: europe-seed
          selectable: true
        - label: Climate Growth Fund
          value: climate-growth
          selectable: true
    expected:
      invalidInactiveOrAmbiguousFund: true
      presentsActualSelectableFundNames: true
      presentsCreateUnassignedOption: true
      askOneFocusedQuestion: true
      mayExecuteBoundedMutation: false
      maySilentlySubstituteFund: false

  - id: zero-active-funds-allows-unassigned-creation
    projectTypeKey: vc_deal_pipeline
    userInstruction: Create a Deal for Example Labs from this conversation.
    creationFieldOptionLookup:
      toolName: project.listCreationFieldOptions
      fieldKey: fund_id
      selectableOptions: []
    creationRequest:
      toolName: project.createFromChat
      fieldValues: {}
      handoffFundState: no_active_funds_configured
    expected:
      explainsNoActiveFundsConfigured: true
      explainsFundRelativeWorkUnavailable: true
      mayExecuteBoundedMutation: true
      persistsFundId: false
      describesDealCreationAsBlocked: false

  - id: direct-chat-to-deal
    toolName: project.createFromChat
    sourceChatId: 2d5c7f18-6f0a-4f5d-9b75-6bf6d871b4c2
    idempotencyKey: pipeline-manager:example-labs:create:2026-08-14
    projectTypeKey: vc_deal_pipeline
    userInstruction: Create a Deal for Example Labs from this conversation, use the attached deck, and leave it unassigned.
    resolvedCompany:
      name: Example Labs
      domain: example.invalid
    confirmedFundId: null
    duplicateCandidates: []
    sourceLinks:
      - https://example.invalid/company
    sourceChatArtifacts:
      - source-note.md
    handoff:
      whyCreated: The user asked Pipeline Manager to add Example Labs to the Deal Pipeline.
      sourceSummary: Example Labs is raising a Seed round; source-note.md is the primary source and Fund assignment was intentionally waived.
      unresolvedQuestions: []
    toolOnlyValues:
      sourceChatId: 2d5c7f18-6f0a-4f5d-9b75-6bf6d871b4c2
      projectId: 7f56a2d1-8c43-4b91-a6e0-2d93f4c5b718
      projectTypeVersionId: 91b7d4e2-3a68-4f25-8c10-5d6e7f8a9b20
      profileId: 4c8d1e73-2b90-4a65-9f31-7e5d6c4b3a21
      artifactId: 6a2f9c84-1d57-4b30-8e62-9c7d5a4b3f10
      messageId: 8b3e7d95-2c61-4a40-9f73-1d6e5c4b2a09
      operationId: create-example-labs-from-chat
      idempotencyKey: pipeline-manager:example-labs:create:2026-08-14
    serverReceipt:
      status: created
      project:
        id: 7f56a2d1-8c43-4b91-a6e0-2d93f4c5b718
        name: Example Labs
        projectTypeVersionId: 91b7d4e2-3a68-4f25-8c10-5d6e7f8a9b20
      linkedArtifacts:
        - filename: source-note.md
      action:
        type: open_project
        projectId: 7f56a2d1-8c43-4b91-a6e0-2d93f4c5b718
        label: Open Example Labs
    completeVisibleAssistantResponse: "Created Example Labs and linked source-note.md."
    renderedPlatformActions:
      - type: open_project
        projectId: 7f56a2d1-8c43-4b91-a6e0-2d93f4c5b718
        label: Open Example Labs
    expected:
      exactActionApproved: create
      mayExecuteBoundedMutation: true
      requiresProposalCard: false
      requiresReviewButton: false
      requiresModal: false
      requiresRedundantConfirmation: false
      preserveSourceChat: true
      requestIncludesArtifactIds: false
      serverDiscoversAndLinksSourceChatArtifacts: true
      structuredReceiptRequiredBeforeSuccess: true
      visibleReadbackSentenceLimit: 1
      visibleResponseContainsToolOnlyIdentifiers: false
      constructsNavigationLink: false
      usesReturnedPlatformActionExclusively: true
      duplicatesHandoffInSourceResponse: false
      handoffToAgentTemplateKey: vc_deal_pipeline_manager
      handoffAuthor: Pipeline Manager
      handoffIncludesRawIds: false
      handoffIncludesTranscriptDump: false

  - id: direct-chat-to-existing-deal-room
    toolName: project.createFromChat
    sourceChatId: 3e6d8a29-7f1b-4a6e-8c86-7cf7e982c5d3
    idempotencyKey: pipeline-manager:legacy-labs:create:2026-08-17
    projectTypeKey: vc_deal_room
    userInstruction: Create a Deal for Legacy Labs from this conversation and use the attached deck.
    resolvedCompany:
      name: Legacy Labs
      domain: legacy.invalid
    confirmedFundId: null
    duplicateCandidates: []
    sourceLinks:
      - https://legacy.invalid/company
    sourceChatArtifacts:
      - legacy-deck.pdf
    handoff:
      whyCreated: The user asked Pipeline Manager to add Legacy Labs to the existing Deal Pipeline.
      sourceSummary: Legacy Labs is raising a Seed round; legacy-deck.pdf is the primary source.
      unresolvedQuestions:
        - Confirm the round target from source evidence.
    toolOnlyValues:
      sourceChatId: 3e6d8a29-7f1b-4a6e-8c86-7cf7e982c5d3
      projectId: 8a67b3e2-9d54-4c18-a7f2-6d8e1b3c5a90
      projectTypeVersionId: 42c8e5b1-6d93-4a20-8f76-2e9b7c1d5a34
      profileId: 5d9e2f84-3c01-4b76-a8e2-9f6d5c4b3a10
      artifactId: 7b3f0d95-2e68-4c41-9f73-8d6e5a4b3c21
      messageId: 9c4e8a06-3d72-4b51-8f64-2e7d6c5b4a32
      operationId: create-legacy-labs-from-chat
      idempotencyKey: pipeline-manager:legacy-labs:create:2026-08-17
    serverReceipt:
      status: created
      project:
        id: 8a67b3e2-9d54-4c18-a7f2-6d8e1b3c5a90
        name: Legacy Labs
        projectTypeVersionId: 42c8e5b1-6d93-4a20-8f76-2e9b7c1d5a34
      linkedArtifacts:
        - filename: legacy-deck.pdf
      action:
        type: open_project
        projectId: 8a67b3e2-9d54-4c18-a7f2-6d8e1b3c5a90
        label: Open Legacy Labs
    completeVisibleAssistantResponse: "Created Legacy Labs and linked legacy-deck.pdf."
    renderedPlatformActions:
      - type: open_project
        projectId: 8a67b3e2-9d54-4c18-a7f2-6d8e1b3c5a90
        label: Open Legacy Labs
    expected:
      exactActionApproved: create
      mayExecuteBoundedMutation: true
      requiresProposalCard: false
      requiresReviewButton: false
      requiresModal: false
      requiresRedundantConfirmation: false
      preserveSourceChat: true
      requestIncludesArtifactIds: false
      serverDiscoversAndLinksSourceChatArtifacts: true
      structuredReceiptRequiredBeforeSuccess: true
      visibleReadbackSentenceLimit: 1
      visibleResponseContainsToolOnlyIdentifiers: false
      constructsNavigationLink: false
      usesReturnedPlatformActionExclusively: true
      duplicatesHandoffInSourceResponse: false
      handoffToAgentTemplateKey: vc_deal_manager
      handoffAuthor: Pipeline Manager
      handoffIncludesRawIds: false
      handoffIncludesTranscriptDump: false

  - id: approved-custom-task-with-assignment
    selectedDeal:
      name: Example Labs
      projectTypeKey: vc_deal_pipeline
    userInstruction: Create a task for the Deal Analyst to reconcile the ARR claim to signed customer schedules.
    availableTaskDefinitionSlugs:
      - generate-refresh-screening-report
      - generate-refresh-evaluation-report
      - prepare-refresh-ic-memo
      - review-refresh-term-sheet
    openTasks: []
    projectTaskRouting:
      defaultAgentType: vc_deal_analyst
      requireAgentExecutor: true
    expected:
      exactTaskApproved: true
      taskKind: custom
      toolName: task-management.createTask
      taskDefinitionId: null
      maySubstituteGeneralTask: false
      assignmentIsAtomic: true
      defaultHumanOwner: current_user
      agentExecutorFromProjectType: vc_deal_analyst
      readBackToolName: task-management.getTaskDetail
      requiresPersistedOutputOrQuestion: true
      visibleReceiptUsesHumanReadableValuesOnly: true

  - id: missing-required-field-clarification
    sourceChatId: chat-2
    userInstruction: Create a Deal from this conversation.
    resolvedCompany:
      name: null
      domain: null
    expected:
      askOneFocusedQuestion: true
      unresolvedField: company_name
      mayExecuteBoundedMutation: false

  - id: duplicate-deal-ambiguity
    sourceChatId: chat-3
    userInstruction: Add Example Labs to the pipeline.
    resolvedCompany:
      name: Example Labs
      domain: example.invalid
    duplicateCandidates:
      - name: Example Labs
        dealUrl: https://example.invalid/deals/example-labs
    separateDealIntent: null
    expected:
      linkExistingDeal: true
      askOneFocusedQuestion: true
      mayExecuteBoundedMutation: false

  - id: bounded-deal-update
    toolName: project.applyPortfolioOperations
    userInstruction: Assign Example Labs to the Europe Seed Fund.
    targetDealUrl: https://example.invalid/deals/example-labs
    operation:
      operationId: update-example-labs-fund
      projectId: 7f56a2d1-8c43-4b91-a6e0-2d93f4c5b718
      type: update_fields
      expectedProjectTypeVersionId: version-deal-room-1
      fieldValues:
        fund_id: europe-seed
    expected:
      exactActionApproved: update_allowlisted_fields
      revalidateActiveFundOption: true
      mayChangeLifecycleStage: false
      mayMakeInvestmentDecision: false
      readBackBeforeReceipt: true

  - id: bounded-archive-restore
    toolName: project.applyPortfolioOperations
    requests:
      - instruction: Archive Example Labs.
        targetDealUrl: https://example.invalid/deals/example-labs
        operation:
          operationId: archive-example-labs
          projectId: 7f56a2d1-8c43-4b91-a6e0-2d93f4c5b718
          type: archive
          expectedProjectTypeVersionId: version-deal-room-1
      - instruction: Restore Example Labs.
        targetDealUrl: https://example.invalid/deals/example-labs
        operation:
          operationId: restore-example-labs
          projectId: 7f56a2d1-8c43-4b91-a6e0-2d93f4c5b718
          type: restore
          expectedProjectTypeVersionId: version-deal-room-1
    expected:
      mayUseGenericProjectMutation: false
      readBackBeforeReceipt: true

  - id: multi-deal-partial-failure
    toolName: project.applyPortfolioOperations
    userInstruction: Archive Example Labs and Northstar.
    topLevelStatus: partial
    results:
      - operationId: archive-example-labs
        dealUrl: https://example.invalid/deals/example-labs
        status: succeeded
      - operationId: archive-northstar
        dealUrl: https://example.invalid/deals/northstar
        status: failed
        reason: permission_lost
    expected:
      reportPerDealResult: true
      mayClaimWholeRequestSuccess: false

reportFundScenarios:
  - id: confirmed-active-fund-report
    projectFundId: europe-seed
    matchingFund:
      id: europe-seed
      name: Europe Seed Fund
      status: actively_investing
    expected:
      displayedFundName: Europe Seed Fund
      fundFitSourceId: europe-seed
      mayBlendFunds: false
      mayMakeFundFitClaim: true

  - id: unassigned-fund-report
    projectFundId: null
    expected:
      displayedFundState: "Fund: Unassigned"
      mayMakeFundFitClaim: false
      mayPersistFundId: false

  - id: unknown-fund-report
    projectFundId: missing-fund
    expected:
      displayedFundState: "Fund: Unknown (missing-fund)"
      mayMakeFundFitClaim: false
      correctionRequired: true

  - id: inactive-fund-report
    projectFundId: legacy-opportunity
    matchingFund:
      id: legacy-opportunity
      name: Legacy Opportunity Fund
      status: closed_to_new_investments
    expected:
      displayedFundState: "Fund: Legacy Opportunity Fund (inactive)"
      mayMakeFundFitClaim: false
      correctionRequired: true

reportQuestionScenarios:
  - id: no-supported-questions
    previousQuestions: []
    currentEvidenceGaps: []
    expectedOpenQuestions: []

  - id: stable-question-across-refresh
    previousQuestions:
      - id: financial-revenue-reconciliation
        status: open
    currentEvidenceGaps:
      - area: financial
        evidenceNeeded: Revenue ledger and signed customer schedules
    expected:
      retainedQuestionId: financial-revenue-reconciliation
      createsDuplicate: false

  - id: question-covered-by-existing-task
    currentQuestionId: financial-revenue-reconciliation
    existingTaskIds:
      - task-finance-1
    expected:
      createDuplicateTask: false
      linkOrUpdateProposal: true

  - id: resolved-question
    previousQuestionId: financial-revenue-reconciliation
    evidenceNowSupportsAnswer: true
    expected:
      status: answered
      createReplacementQuestion: false

livingReportScenarios:
  - id: first-generation-discovers-corpus
    existingReportArtifactId: null
    projectLinkedArtifacts:
      - {id: deck, observedRevision: "1", contentHash: deck-v1, kind: evidence, readable: true}
      - {id: founder-call, observedRevision: "3", contentHash: call-v3, kind: evidence, readable: true}
      - {id: screening-template, observedRevision: "1", contentHash: template-v1, kind: template, readable: true}
      - {id: workspace-settings, observedRevision: "2", contentHash: config-v2, kind: configuration, readable: true}
    focusArtifactIds: [founder-call]
    expected:
      includedArtifactIds: [deck, founder-call]
      excludedArtifactIds: [screening-template, workspace-settings]
      focusDoesNotRestrictCorpus: true
      createdArtifactCount: 1
      updatedArtifactCount: 0
      createsProjectSharedArtifact: true
      writesEvidenceBasisManifest: true

  - id: refresh-updates-in-place-and-classifies-corpus
    existingReportArtifactId: screening-report
    existingReportObservedRevision: "4"
    existingReportContentHash: report-v4
    previousManifest:
      sources:
        - {artifactId: deck, observedRevision: "1", contentHash: deck-v1}
        - {artifactId: founder-call, observedRevision: "3", contentHash: call-v3}
        - {artifactId: old-market-note, observedRevision: "1", contentHash: market-v1}
    projectLinkedArtifacts:
      - {id: deck, observedRevision: "2", contentHash: deck-v2, kind: evidence, readable: true}
      - {id: founder-call, observedRevision: "3", contentHash: call-v3, kind: evidence, readable: true}
      - {id: financial-model, observedRevision: "1", contentHash: model-v1, kind: evidence, readable: true}
      - {id: screening-report, observedRevision: "4", contentHash: report-v4, kind: report, readable: true}
      - {id: evaluation-template, observedRevision: "1", contentHash: template-v1, kind: template, readable: true}
    additionalReadableArtifacts:
      - {id: screening-upstream, observedRevision: "5", contentHash: screening-v5, kind: upstream_report}
      - {id: customer-reference, observedRevision: "1", contentHash: reference-v1, kind: evidence}
    taskDeclaredArtifactIds: [screening-upstream]
    focusArtifactIds: [customer-reference]
    expected:
      includedArtifactIds: [customer-reference, deck, financial-model, founder-call, screening-upstream]
      excludedArtifactIds: [evaluation-template, screening-report]
      focusDoesNotRestrictCorpus: true
      sourceChanges:
        added: [customer-reference, financial-model, screening-upstream]
        changed: [deck]
        removed: [old-market-note]
        unchanged: [founder-call]
      createdArtifactCount: 0
      updatedArtifactId: screening-report
      updateUsesObservedRevisionAndHash: true
      duplicateFallbackAllowed: false
