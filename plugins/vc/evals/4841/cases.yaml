schemaVersion: "0.1"
id: crm-history-import-4841
description: >-
  Subject inputs for Platform issue #4841: a user asked the Deal Manager to import a company's
  Affinity history and got a CRM inventory instead of useful, sourced company context. This file
  holds only what the subject model may see plus run configuration. Assertions live in
  expectations.yaml and are never sent to the subject. Every company, person, note and ID below is
  invented; no customer data is used.
firmName: Example Ventures

# Skill-control cases run the Deal Analyst on another task for a few steps only. Import cases run the Deal Analyst on the Import or Refresh CRM History task when the arm ships that
# task, and otherwise send the user's request to the Deal Manager (what users had). Routing cases
# always run the Deal Manager.
importRequest: Import all information and notes from Affinity for this company.
taskKickoff: Start this task.

cases:
  - id: rebrand-nine-notes
    kind: import
    deal: {name: Corvane seed, organisation: {name: Corvane, domain: corvane.example}}
    affinity:
      companies:
        - id: 500001
          name: Corvane
          domain: corvane.example
          domains: [corvane.example, ledgerly.example]
          description: Workflow software for accounts-payable teams.
          notes:
            - - {id: 9001, author: Priya Shah, date: "2025-02-11T10:00:00Z", html: "<p>Intro from Mira Okafor (portfolio founder). Ledgerly builds invoice-matching software for mid-market finance teams. Two founders, ex-Sage.</p>"}
              - {id: 9002, author: Priya Shah, date: "2025-03-04T15:30:00Z", html: "<p>First meeting. They plan to raise a <strong>€2m seed</strong> in Q3 2025. 14 paying customers, mostly UK.</p>"}
              - {id: 9003, author: Tom Becker, date: "2025-04-22T09:00:00Z", html: "<p>Product demo. Matching accuracy claimed at 96%; not independently verified.</p><ul><li>Pilot with Harbourline Logistics starting May</li><li>Pricing per seat</li></ul>"}
              - {id: 9004, author: Priya Shah, date: "2025-06-02T11:00:00Z", html: "<p>Ledgerly is rebranding to <strong>Corvane</strong> from July; new domain corvane.example.</p>"}
              - {id: 9005, author: Tom Becker, date: "2025-07-18T14:00:00Z", html: "<p>Harbourline pilot extended to September. No conversion to paid yet.</p>"}
              - {id: 9006, author: Priya Shah, date: "2025-09-09T10:00:00Z", html: "<p>Round now targeting <strong>€3m</strong> with a lead in discussion. Reason for the larger round not given.</p>"}
              - {id: 9007, author: Priya Shah, date: "2025-10-01T16:00:00Z", html: "<p>Partner meeting: concern about churn in the SMB segment. Asked for a cohort table.</p>"}
              - {id: 9008, author: Tom Becker, date: "2025-11-12T09:30:00Z", html: "<p>Cohort table not yet received. Founders say 22 customers now.</p>"}
              - {id: 9009, author: Priya Shah, date: "2026-01-20T13:00:00Z", html: "<p>Passed for now: timing. Keep warm; revisit when they have 12 months of cohort data.</p>"}

