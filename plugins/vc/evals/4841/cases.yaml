run:
  subject:
    provider: openai-responses
    modelId: gpt-5.6-luna
    endpoint: https://api.openai.com/v1/responses
    reasoningScale: 5
    reasoning: {effort: medium, summary: detailed}
    textVerbosity: medium
    maxOutputTokens: 128000
    store: false
    include: [reasoning.encrypted_content]
  repetitions: 3
  limits:
    maxStepsPerTurn: 40
    callTimeoutSeconds: 300
    attemptWallClockSeconds: 1500
    maxConsecutiveProviderErrors: 3
  prices:
    enforcementBasis: platformBillable
    platformBillable:
      source: Platform config/llm_pricing.json @ a387b635 (1.3x markup), copied from evals/4843/cases.yaml.
      usdPerMillionTokens:
        gpt-5.6-luna:
          input: 0.26
          cachedInput: 0.026
