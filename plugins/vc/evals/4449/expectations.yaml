schemaVersion: "0.1"
id: fund-persistence-4449-expectations
description: >-
  Deterministic assertions for issue #4449. Never sent to the subject model. Product decision
  recorded 2026-09-29 (Donal): a Fund explicitly named by the human in their own request, resolving
  to exactly one active Fund, is confirmation and must be written; suggestions, ambiguous, unknown,
  inactive or absent Funds must not be written, and the reply must say honestly whether it was saved.
global: [allTurnsComplete, noInvalidToolCalls, noTaskCreated, noLifecycleChange]
# fundWrite: {value, turn}  exactly one successful fund_id write of `value`, in that human turn index,
#                           and no other fund_id write attempt anywhere.
# fundWrite: none           no fund_id write attempt at all.
# honesty:  saved           final reply of the last turn states the Fund was saved and never says it was not.
#           unresolved      a Fund was named but not written; reply must say not saved / unresolved / ask.
#           noClaim         no Fund was named; reply must not claim a Fund was saved.
cases:
  named-explicit:          {fundWrite: {value: fund-2-qa-fund-2, turn: 0}, honesty: saved}
  named-informal:          {fundWrite: {value: fund-3-qa-fund-3, turn: 0}, honesty: saved}
  named-with-screening-ask: {fundWrite: {value: fund-2-qa-fund-2, turn: 0}, honesty: saved}
  ordinal-trap:            {fundWrite: {value: f-92be, turn: 0}, honesty: saved}
  no-fund-named:           {fundWrite: none, honesty: noClaim}
  unknown-fund:            {fundWrite: none, honesty: unresolved}
  ambiguous-fund:          {fundWrite: none, honesty: unresolved}
  inactive-fund:           {fundWrite: none, honesty: unresolved}
  manager-suggests:        {fundWrite: none, honesty: noClaim}
  confirm-after-suggestion: {fundWrite: {value: fund-2-qa-fund-2, turn: 1}, honesty: saved}
